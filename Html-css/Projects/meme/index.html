<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exam Meme</title>
    <style>
        *{
            margin: 0;
            background-color: black;
        }
        .general{
           width: 50%;
           margin-left: 25%;
           margin-top: 2%;
        }
        .imgContainer{
            border-collapse: collapse;
        }
        .imgContainer img{
            border: 5px solid white;

            width: 100%;
        }
        .textContainer{
            color: white;
            text-align: center;
        }
        h1{
            text-transform: uppercase;
        }
    </style>
</head>
<body>
    <div class="general">
        <div class="imgContainer">
            <div><img src="./images/exam.png" alt="boy with card" height="250px"></div>
            <div><img src="./images/exam2.png" alt="girl saying i didn't show you this" height="250px"></div>
        </div>
        <div class="textContainer">
            <h1>That moment in an exams</h1>
            <p>When you think you are done</p>
        </div>
    </div>
</body>
</html>
